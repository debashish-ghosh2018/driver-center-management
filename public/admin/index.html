<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driver Center Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{background:#f5f7fb}.sidebar{min-height:100vh;background:#172033;color:#fff}
    .sidebar a{color:#cbd5e1;text-decoration:none;display:block;padding:10px 14px;border-radius:8px}
    .sidebar a:hover,.sidebar a.active{background:#293751;color:#fff}
    .card-kpi{border:0;border-radius:14px}.content{min-height:100vh}
    .table td,.table th{vertical-align:middle}
  </style>
</head>
<body>
<div id="loginView" class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h3 class="mb-1">Driver Center</h3>
          <p class="text-muted">Administrator Login</p>
          <div id="loginError" class="alert alert-danger d-none"></div>
          <form id="loginForm">
            <input id="email" class="form-control mb-3" type="email" value="admin@drivercenter.local" placeholder="Email">
            <input id="password" class="form-control mb-3" type="password" value="Admin@12345" placeholder="Password">
            <button class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="appView" class="d-none">
  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-2 sidebar p-3">
        <h4 class="mb-4">Driver Center</h4>
        <a href="#" data-page="dashboard" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="#" data-page="customers"><i class="bi bi-people"></i> Customers</a>
        <a href="#" data-page="drivers"><i class="bi bi-person-badge"></i> Drivers</a>
        <a href="#" data-page="vehicles"><i class="bi bi-car-front"></i> Vehicles</a>
        <a href="#" data-page="bookings"><i class="bi bi-calendar-check"></i> Bookings</a>
        <a href="#" data-page="payments"><i class="bi bi-credit-card"></i> Payments</a>
        <a href="#" data-page="reports"><i class="bi bi-bar-chart"></i> Reports</a>
        <a href="#" data-page="users"><i class="bi bi-person-gear"></i> Users</a>
        <a href="#" data-page="acl"><i class="bi bi-shield-lock"></i> ACL</a>
        <a href="#" id="logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </aside>
      <main class="col-md-10 content p-4">
        <div id="page"></div>
      </main>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
